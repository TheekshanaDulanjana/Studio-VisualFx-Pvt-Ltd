<!doctype html>
<html lang="en">
<head>
  <!-- ============================================================
       CHARSET / VIEWPORT — must stay first in <head>
  ============================================================= -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- ============================================================
       RESOURCE HINTS
       preconnect = open the TCP/TLS handshake early for origins we
       WILL use render-critically (fonts, GTM). Kept to 2–3 origins;
       over-using preconnect wastes the browser's limited early
       connection budget and can slow other requests down.
       crossorigin is required on the gstatic preconnect because
       font files are fetched with CORS.
  ============================================================= -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.googletagmanager.com" />
  <!-- dns-prefetch as a cheap fallback for browsers that don't support preconnect -->
  <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

  <!-- ============================================================
       PRIMARY SEO TAGS (site-wide fallback for non-JS crawlers)
       Trimmed the description to ~155 characters — Google truncates
       longer snippets, and a clipped sentence looks unfinished in
       search results. Title kept under ~60 characters so it doesn't
       truncate with an ellipsis on the SERP.
       IMPORTANT: this is still a client-rendered SPA. Crawlers that
       run JavaScript (Googlebot) will see whatever react-helmet-async
       injects per route (see /src/seo/SEOHead.jsx). Crawlers that
       DON'T run JS (Bing, WhatsApp, LinkedIn, X, Facebook's first
       pass) will only ever see what's in this file — which is why
       the <noscript> block further down exists: it's the only
       content those bots get for every single URL on the site.
  ============================================================= -->
  <title>Studio VisualFX | Wedding & Commercial Videography, Sri Lanka</title>
  <meta name="description" content="Cinematic wedding films, event coverage, commercial and music videos by Studio VisualFX — a Matara-based production studio serving all of Sri Lanka." />
  <link rel="canonical" href="https://www.studiovisualfx.com/" />

  <!-- Robots: index + follow, explicit rich-result opt-ins -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="googlebot" content="index, follow" />

  <!-- Author / Publisher -->
  <meta name="author" content="Studio VisualFX" />
  <meta name="application-name" content="Studio VisualFX" />
  <!-- Prevents mobile browsers auto-linking phone-number-looking text in body copy -->
  <meta name="format-detection" content="telephone=no" />

  <!-- ============================================================
       FAVICONS / PWA
  ============================================================= -->
  <link rel="icon" type="image/svg+xml" href="/TabIcon.svg" />
  <link rel="shortcut icon" href="https://www.studiovisualfx.com/TabIcon.png" />
  <link rel="icon" type="image/png" href="https://www.studiovisualfx.com/WebTab.png" sizes="192x192" />
  <!-- 180x180 is Apple's documented ideal size; reusing WebTab.png works but a
       purpose-cropped 180x180 PNG will render sharper on iOS home screens -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://www.studiovisualfx.com/WebTab.png" />

  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#000000" />

  <!-- ============================================================
       GOOGLE FONTS
       font-display=swap avoids invisible text on load (FOIT), which
       directly protects your Lighthouse "Avoid invisible text" audit
       and your CLS/LCP scores.
       NOTE (unchanged from before, still worth acting on): serving
       fonts from Google's CDN sends EU visitors' IPs to Google at
       request time — a German court fined a site operator over this
       in 2022. If you expect EU traffic, self-host these 4 families
       with @font-face + font-display: swap instead of this <link>.
  ============================================================= -->
  <link href="https://fonts.googleapis.com/css2?family=Alata&family=Alatsi&family=Belleza&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

  <!-- ============================================================
       OPEN GRAPH (Facebook / WhatsApp / LinkedIn)
  ============================================================= -->
  <meta property="og:title" content="Studio VisualFX | Wedding & Commercial Videography, Sri Lanka" />
  <meta property="og:description" content="Cinematic wedding films, event coverage, commercial and music videos — crafted by Studio VisualFX, Sri Lanka." />
  <meta property="og:image" content="https://www.studiovisualfx.com/livepreview.jpg" />
  <meta property="og:image:secure_url" content="https://www.studiovisualfx.com/livepreview.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:alt" content="Studio VisualFX — Wedding, Event & Commercial Videography" />
  <meta property="og:url" content="https://www.studiovisualfx.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Studio VisualFX" />
  <meta property="og:locale" content="en_LK" />

  <!-- ============================================================
       TWITTER / X CARD
       Handle lines left commented — uncomment and fill in only once
       you have real @handles. A placeholder/fake handle reads as
       spam to the crawler and can suppress the card entirely.
  ============================================================= -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Studio VisualFX | Wedding & Commercial Videography, Sri Lanka" />
  <meta name="twitter:description" content="Cinematic wedding films, event coverage, commercial and music videos — crafted by Studio VisualFX, Sri Lanka." />
  <meta name="twitter:image" content="https://www.studiovisualfx.com/livepreview.jpg" />
  <meta name="twitter:image:alt" content="Studio VisualFX — Wedding, Event & Commercial Videos" />
  <!-- <meta name="twitter:site" content="@YourRealHandle" /> -->
  <!-- <meta name="twitter:creator" content="@YourRealHandle" /> -->

  <!-- ============================================================
       STRUCTURED DATA
       Consolidated into a single @graph so all entities share one
       script tag and can reference each other by @id (this is the
       pattern Google's own docs and most SEO tooling recommend over
       several standalone JSON-LD blocks). Added WebSite (enables a
       sitelinks searchbox eligibility check) linked to the
       LocalBusiness via @id, and image as an ImageObject so Google
       can validate its dimensions against og:image:width/height.

       TODO for you to fill in with real values — every one of these
       meaningfully affects rich-result eligibility or local pack
       ranking, so don't ship placeholders:
       - "streetAddress" (Matara address, currently only locality/region)
       - "geo": { "@type": "GeoCoordinates", "latitude": ..., "longitude": ... }
       - "openingHoursSpecification"
       - "founder" (a Person entity) — strengthens E-E-A-T signals
       - "aggregateRating" / "review" — ONLY add this if you have real,
         verifiable reviews marked up on the page; fabricated review
         markup is a Google Rich Results policy violation and can get
         the whole domain manually penalized.
  ============================================================= -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "LocalBusiness",
        "@id": "https://www.studiovisualfx.com/#business",
        "name": "Studio VisualFX (Pvt) Ltd",
        "image": {
          "@type": "ImageObject",
          "url": "https://www.studiovisualfx.com/livepreview.jpg",
          "width": 1200,
          "height": 630
        },
        "url": "https://www.studiovisualfx.com",
        "logo": "https://www.studiovisualfx.com/WebTab.png",
        "description": "Studio VisualFX is a dynamic video production and event photography company delivering high-quality visual content for weddings, events, commercials, and music videos.",
        "telephone": "+94776996981",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Matara",
          "addressRegion": "Southern Province",
          "postalCode": "81000",
          "addressCountry": "LK"
        },
        "sameAs": [
          "https://facebook.com/visualfxsl",
          "https://www.instagram.com/studiovisualfx",
          "https://wa.me/94776996981"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://www.studiovisualfx.com/#website",
        "url": "https://www.studiovisualfx.com/",
        "name": "Studio VisualFX",
        "publisher": { "@id": "https://www.studiovisualfx.com/#business" },
        "inLanguage": "en-LK"
      },
      {
        "@type": "WebPage",
        "@id": "https://www.studiovisualfx.com/#webpage",
        "url": "https://www.studiovisualfx.com/",
        "name": "Studio VisualFX | Wedding & Commercial Videography, Sri Lanka",
        "isPartOf": { "@id": "https://www.studiovisualfx.com/#website" },
        "about": { "@id": "https://www.studiovisualfx.com/#business" },
        "inLanguage": "en-LK"
      }
    ]
  }
  </script>

  <!-- ============================================================
       GOOGLE ANALYTICS (GA4)
       `async` already defers execution off the parser, which is the
       main thing that keeps this from blocking render. If you serve
       EU visitors, gate the `gtag('config', ...)` call behind a
       cookie-consent banner instead of firing it unconditionally on
       load — GDPR requires consent before non-essential analytics
       cookies are set.
  ============================================================= -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HGGY56NJ90"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HGGY56NJ90');
  </script>
</head>

<body>
  <div id="root"></div>

  <!-- ============================================================
       NOSCRIPT FALLBACK — this is the single biggest SEO gap in a
       client-only-rendered SPA. Any crawler or share-preview bot
       that does NOT execute JavaScript (Bing, DuckDuckGo, Facebook's
       first-pass scraper, WhatsApp/iMessage link previews, some
       accessibility/reader-mode tools) sees ONLY what's between
       these tags — for every route on the site, since it's baked
       into this one shared index.html. Without it, those crawlers
       see a blank page and either skip indexing it or index it with
       no content at all.
       Keep this in sync at a high level whenever your main nav or
       core service list changes — it doesn't need to be exhaustive,
       just enough real text + real links that a non-JS crawler has
       something to index and follow.
  ============================================================= -->
  <noscript>
    <header>
      <h1>Studio VisualFX — Wedding, Event &amp; Commercial Videography in Sri Lanka</h1>
      <p>
        Studio VisualFX is a Matara-based video production and photography
        studio crafting cinematic wedding films, event coverage, commercial
        videos, and music videos, serving clients island-wide across Sri Lanka.
      </p>
    </header>
    <nav aria-label="Main">

      </ul>
    </nav>
    <p>

    </p>
  </noscript>

  <script type="module" src="/src/main.jsx"></script>
</body>
