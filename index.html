    DEFAULT head tags for crawlers/share bots that don't run JS.
    Tags marked data-rh="true" are REPLACED per route by react-helmet-async
    (src/seo/RouteSEO.jsx), so each URL ends up with exactly one description,
    canonical, og:* etc. No static canonical / og:url on purpose: a hard-coded
    homepage canonical on every route tells Google every page is the homepage.
    VERIFY in DevTools that only one of each tag exists after navigating.
  -->

  <!-- GA4: send_page_view:false because App.jsx sends the page view (avoids a duplicate on first load) -->
  <!-- gtag() queues events right away; the GA library itself loads after the
       page has finished loading so it never slows the first paint. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HGGY56NJ90', { send_page_view: false });
    (function () {
      function loadGA() {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-HGGY56NJ90';
        document.head.appendChild(s);
      }
      function later() { setTimeout(loadGA, 1500); }
      if (document.readyState === 'complete') later();
      else window.addEventListener('load', later, { once: true });
    })();
  </script>
